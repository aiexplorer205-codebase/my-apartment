# Disposable PostgreSQL for opt-in tests. No application volumes or credentials.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: disposable-schema-test
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: adobe/s3mock:4.11.0@sha256:cd49108c0094bc3f420b24bff354073032a9ec1a6f4cc89f8e8f483a308cf99e
    ports:
      - '127.0.0.1:59000:9090'
