name: Feature request
description: Propose a product or engineering improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or engineering problem this would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired outcome. Avoid including secrets or customer data.
    validations:
      required: true
