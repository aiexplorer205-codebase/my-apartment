name: Bug report
description: Report a reproducible defect without including sensitive data.
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Explain what happened. Do not include personal or production data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
