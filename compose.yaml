services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-platform_db}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6381}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4001
      POSTGRES_PLATFORM_URL: ${POSTGRES_PLATFORM_URL:-postgresql://postgres:postgres@postgres:5432/platform_db}
      POSTGRES_TENANT_URL: ${POSTGRES_TENANT_URL:-postgresql://postgres:postgres@postgres:5432/tenant_template}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.nivasa.local}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://example.auth0.com/}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
      AUTH0_PASSWORDLESS_CONNECTION: ${AUTH0_PASSWORDLESS_CONNECTION:-email}
      AUTH0_ADMIN_CLIENT_ID: ${AUTH0_ADMIN_CLIENT_ID:-}
      AUTH0_ADMIN_CLIENT_SECRET: ${AUTH0_ADMIN_CLIENT_SECRET:-}
      AUTH0_RESIDENT_CLIENT_ID: ${AUTH0_RESIDENT_CLIENT_ID:-}
      AUTH0_RESIDENT_CLIENT_SECRET: ${AUTH0_RESIDENT_CLIENT_SECRET:-}
      ADMIN_WEB_PUBLIC_URL: ${ADMIN_WEB_PUBLIC_URL:-http://localhost:3100}
      RESIDENT_WEB_PUBLIC_URL: ${RESIDENT_WEB_PUBLIC_URL:-http://localhost:3098}
      OPERATOR_IDS: ${OPERATOR_IDS:-}
      OPERATOR_ID: ${OPERATOR_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://localhost:3101}
      AUTH0_OTP_ENABLED: ${AUTH0_OTP_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-replace-with-resend-key}
      RESEND_FROM: ${RESEND_FROM:-no-reply@local.nivasa.test}
      FILEBASE_ENDPOINT: ${FILEBASE_ENDPOINT:-https://example.filebase.com}
      FILEBASE_BUCKET: ${FILEBASE_BUCKET:-nivasa-local-dev}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-replace-me}
      QUEUE_RETRY_LIMIT: ${QUEUE_RETRY_LIMIT:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-4101}:4001'
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:4001/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4010
      POSTGRES_PLATFORM_URL: ${POSTGRES_PLATFORM_URL:-postgresql://postgres:postgres@postgres:5432/platform_db}
      POSTGRES_TENANT_URL: ${POSTGRES_TENANT_URL:-postgresql://postgres:postgres@postgres:5432/tenant_template}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.nivasa.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-replace-with-resend-key}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-replace-me}
      QUEUE_RETRY_LIMIT: ${QUEUE_RETRY_LIMIT:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WORKER_PORT:-4110}:4010'
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:4010/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  login-web:
    build:
      context: .
      dockerfile: docker/login-web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_WEB_PUBLIC_URL: ${ADMIN_WEB_PUBLIC_URL:-http://localhost:3100}
      RESIDENT_WEB_PUBLIC_URL: ${RESIDENT_WEB_PUBLIC_URL:-http://localhost:3098}
    ports:
      - '127.0.0.1:${LOGIN_WEB_PORT:-3099}:3000'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  resident-web:
    build:
      context: .
      dockerfile: docker/resident-web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4001
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.nivasa.local}
      AUTH0_CLIENT_ID: ${AUTH0_RESIDENT_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_RESIDENT_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_RESIDENT_SECRET:-replace-with-unique-32-byte-random-secret}
      APP_BASE_URL: ${RESIDENT_WEB_PUBLIC_URL:-http://localhost:3098}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${RESIDENT_WEB_PORT:-3098}:3000'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  admin-web:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4001
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.nivasa.local}
      AUTH0_CLIENT_ID: ${AUTH0_ADMIN_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_ADMIN_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_ADMIN_SECRET:-replace-with-unique-32-byte-random-secret}
      APP_BASE_URL: ${ADMIN_WEB_PUBLIC_URL:-http://localhost:3100}
      RESIDENT_WEB_PUBLIC_URL: ${RESIDENT_WEB_PUBLIC_URL:-http://localhost:3098}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${ADMIN_WEB_PORT:-3100}:3000'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  operator-web:
    build:
      context: .
      dockerfile: docker/operator.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4001
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.nivasa.local}
      AUTH0_CLIENT_ID: ${AUTH0_OPERATOR_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_OPERATOR_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_OPERATOR_SECRET:-replace-with-unique-32-byte-random-secret}
      APP_BASE_URL: ${OPERATOR_WEB_PUBLIC_URL:-http://localhost:3101}
      OPERATOR_WEB_PRIVATE_INGRESS: ${OPERATOR_WEB_PRIVATE_INGRESS:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${OPERATOR_WEB_PORT:-3101}:3001'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - login-web
      - resident-web
      - admin-web
      - operator-web
      - api
    ports:
      - '127.0.0.1:${PROXY_PORT:-8080}:80'

volumes:
  postgres-data:
  redis-data:
