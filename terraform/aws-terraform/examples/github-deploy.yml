# Copy to .github/workflows/deploy.yml
# One-time GitHub setup:
#   Settings > Secrets and variables > Actions
#     Secret   AWS_DEPLOY_ROLE_ARN = terraform output ci_deploy_role_arn
#     Variable EC2_INSTANCE_ID     = terraform output instance_id
name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write   # needed for AWS OIDC login
  contents: read
  packages: write

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    runs-on: ubuntu-latest   # use ubuntu-24.04-arm for native arm64 builds if your repo is public
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # t4g = arm64. If you use t3.small change this to linux/amd64
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over SSM (no SSH, no open ports)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          CMD="cd /opt/myapartment && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -n --arg c "$CMD" '{commands:[$c]}')" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || FAILED=1
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          [ -z "${FAILED:-}" ]
